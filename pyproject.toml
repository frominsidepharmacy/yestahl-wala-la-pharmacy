[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yestahl-wala-la-pharmacy"
version = "1.0.0"
description = "Zero-cost pharmacist-led Instagram carousel automation"
requires-python = ">=3.9"
dependencies = [
  "arabic-reshaper==3.0.0",
  "beautifulsoup4==4.12.3",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "python-bidi==0.6.3",
]

[project.optional-dependencies]
browser = ["playwright==1.49.1"]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
