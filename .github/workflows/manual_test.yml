name: Tests and credential-free dry run
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_PAID_SERVICES: "false"
      REQUIRE_MANUAL_APPROVAL: "true"
      FREE_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - run: python -m scripts.dry_run
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: output/dry-run
          retention-days: 7
