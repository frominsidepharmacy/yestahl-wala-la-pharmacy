name: Release queued carousel for approval

on:
  schedule:
    # 16:00 UTC = 20:00 Asia/Dubai year-round.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: Inventory category to release
        required: true
        default: korean_skincare
        type: choice
        options:
          - korean_skincare
          - vitamins_supplements
          - personal_care

permissions:
  contents: write

concurrency:
  group: pharmacy-curated-inventory
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_PAID_SERVICES: "false"
      REQUIRE_MANUAL_APPROVAL: "true"
      FREE_AI_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve manual category override
        id: category
        env:
          MANUAL_CATEGORY: ${{ inputs.category }}
        run: |
          if [ -n "$MANUAL_CATEGORY" ]; then
            category="$MANUAL_CATEGORY"
          else
            category=""
          fi
          echo "category=$category" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select oldest queued carousel
        id: source
        env:
          CATEGORY: ${{ steps.category.outputs.category }}
        run: |
          if [ -n "$CATEGORY" ]; then
            python -m scripts.curated_inventory select --category "$CATEGORY"
          else
            python -m scripts.curated_inventory select
          fi
      - name: Notify empty pharmacy inventory
        if: steps.source.outputs.found != 'true'
        run: python -m scripts.notify
        env:
          NOTIFICATION_MESSAGE: "⚠️ مخزون ${{ steps.category.outputs.category }} فارغ؛ لم تُرسل معاينة في هذا الموعد. سيُعوَّض عند أول تشغيل متاح لـ Codex."
      - name: Send selected carousel to Telegram
        if: steps.source.outputs.found == 'true'
        run: python -m scripts.send_curated_preview
        env:
          CURATED_DIR: ${{ steps.source.outputs.curated_dir }}
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.found == 'true'
        with:
          name: pending-previews-${{ github.run_id }}
          path: ${{ steps.source.outputs.curated_dir }}
          retention-days: 7
      - name: Mark carousel as released
        if: steps.source.outputs.found == 'true'
        run: |
          python -m scripts.curated_inventory mark-previewed --directory "${{ steps.source.outputs.curated_dir }}" --run-id "${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.source.outputs.curated_dir }}/ready.json" "${{ steps.source.outputs.curated_dir }}/previewed.json"
          git commit -m "Release queued pharmacy carousel"
          git pull --rebase origin main
          git push origin HEAD:main
