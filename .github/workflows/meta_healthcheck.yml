name: Meta credential healthcheck
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
      META_API_VERSION: ${{ vars.META_API_VERSION }}
      META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.configure_meta
