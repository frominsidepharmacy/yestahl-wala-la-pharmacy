name: Daily content
on:
  # Scheduled generation moved to the local Codex/ImageGen automation.
  # Keep this workflow manual for diagnostics only.
  workflow_dispatch:
    inputs:
      category:
        description: Category slot to prepare
        required: true
        default: all
        type: choice
        options:
          - all
          - korean_skincare
          - vitamins_supplements
          - personal_care
permissions:
  contents: read
concurrency:
  group: daily-content
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_PAID_SERVICES: "false"
      REQUIRE_MANUAL_APPROVAL: "true"
      FREE_AI_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      TARGET_CATEGORY: ${{ inputs.category }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data/runtime/history.sqlite3
          key: product-history-${{ github.run_id }}
          restore-keys: |
            product-history-
      - run: pip install -r requirements.txt
      - run: python -m scripts.daily
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/runtime/history.sqlite3
          key: product-history-${{ github.run_id }}
      - uses: actions/cache/save@v4
        with:
          path: output/daily
          key: pending-${{ github.run_id }}-${{ hashFiles('output/daily/**/manifest.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: pending-previews-${{ github.run_id }}
          path: output/daily
          retention-days: 7
