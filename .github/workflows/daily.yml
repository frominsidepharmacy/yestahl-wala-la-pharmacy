name: Daily content
on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Dubai"
    - cron: "0 17 * * *"
      timezone: "Asia/Dubai"
    - cron: "0 22 * * *"
      timezone: "Asia/Dubai"
  workflow_dispatch:
    inputs:
      category:
        description: Category slot to prepare
        required: true
        default: all
        type: choice
        options:
          - all
          - korean_skincare
          - vitamins_supplements
          - personal_care
permissions:
  contents: read
concurrency:
  group: daily-content
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_PAID_SERVICES: "false"
      REQUIRE_MANUAL_APPROVAL: "true"
      FREE_AI_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      TARGET_CATEGORY: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.category ||
            (github.event.schedule == '0 12 * * *' && 'korean_skincare' ||
             github.event.schedule == '0 17 * * *' && 'vitamins_supplements' ||
             'personal_care') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.daily
      - uses: actions/cache/save@v4
        with:
          path: output/daily
          key: pending-${{ github.run_id }}-${{ hashFiles('output/daily/**/manifest.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: pending-previews-${{ github.run_id }}
          path: output/daily
          retention-days: 7
