hooks:
  - "عليه {reviews}+ review... بس هل فعلًا يستاهل؟"
  - "تقييمه {rating}... بس التقييم لوحده مش كفاية."
  - "خصم {discount}% مغري... بس هل التركيبة تستاهل؟"
  - "{ingredient} هو سبب شهرة المنتج ده... بس القصة مش بالبساطة دي."
  - "المنتج ده ترند... بس قبل ما تدفع {price} درهم شوف التركيبة."
  - "لو هدفك {use_case}... هل ده فعلًا اختيار مناسب؟"
  - "ناس كتير بتشتريه بسبب {claim}... بس هل المكونات بتدعم الكلام ده؟"
  - "اسم البراند معروف... إنما الحكم عندنا على التركيبة."
  - "سعره {price} درهم... قيمة حقيقية ولا اسم على العبوة؟"
  - "موجود في {retailer}... لكن هل يستحق مكانه في روتينك؟"
  - "منتج مشهور في الصيدلية... خلينا نفكّه مكوّن مكوّن."
  - "قبل ما تشتريه: في تفصيلة صغيرة لازم تعرفها."
  - "العبوة شكلها مقنع... لكن إحنا هنحكم على اللي جواها."
  - "وعد كبير على العبوة... هل الدليل قدّه؟"
  - "منتج يومي ولا فلوس في غير مكانها؟"
  - "لو بشرتك حساسة، ركّز في النقطة دي قبل الشراء."
  - "لو بتاخد مكملات، الاسم ده غالبًا عدى عليك."
  - "منتج بسيط ظاهريًا... لكن طريقة استخدامه هي الفارق."
  - "الأغلى مش دايمًا الأفضل... والمنتج ده اختبار كويس للفكرة."
  - "هل الجرعة المكتوبة مناسبة لهدفك فعلًا؟"
  - "بين الدعاية والتركيبة: فين الحقيقة؟"
  - "قبل ما تحطه في السلة، بص على المكوّن الأساسي."
  - "هل يستاهل يتكرر كل شهر؟ نحسبها سوا."
  - "مكوّن واحد عامل كل الضجة... هل كفاية؟"
  - "روتينك محتاجه فعلًا ولا خطوة زيادة؟"
  - "المنتج مشهور... بس خلينا نبص على التركيبة."
  - "الميزة هنا مش اسم البراند، الميزة في المكونات."
  - "مش كل خصم صفقة... هل ده استثناء؟"
  - "هل العبوة دي عملية ولا هتخلص بسرعة؟"
  - "لو هدفك نتيجة واقعية، توقع إيه من المنتج ده؟"
  - "منتج عليه كلام كتير... والنهارده دوره تحت الميكروسكوب."
  - "هل فيه بديل أوضح وأبسط؟ الأول نفهم ده بيعمل إيه."
  - "إيه اللي يبرر السعر هنا؟"
  - "منتج كويس على الورق... بس الاستخدام هو الامتحان الحقيقي."
  - "المكونات موجودة... لكن هل الوعد منطقي؟"
  - "من جوه الصيدلية: المنتج ده محتاج حكم هادي، مش انبهار."
  - "هنسيب الدعاية على جنب ونشوف المنتج كما هو."
  - "لو محتار تشتريه، الست سلايدز دول معمولين ليك."
